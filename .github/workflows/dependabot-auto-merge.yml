name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Auto-merge Dependabot PR then kick primary CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr merge --squash --delete-branch "$PR_URL"
          # GITHUB_TOKEN merges do not fire push workflows; workflow_dispatch does.
          gh workflow run 'CI' --ref 'master'
